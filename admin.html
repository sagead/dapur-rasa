<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2b2118" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Dashboard Admin — Dapur Rasa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="admin-body">
  <div class="admin-shell" id="adminShell">

    <!-- ============ BILAH ATAS ============ -->
    <header class="admin-top">
      <button class="admin-burger" id="sideToggle" type="button" aria-label="Buka menu dashboard" aria-expanded="false">☰</button>
      <a class="logo" href="index.html">
        <span class="logo-mark">🛠</span>
        <span class="logo-text">Dashboard Admin</span>
      </a>
      <div class="admin-top-cta">
        <span class="admin-who" id="adminWho"></span>
        <a class="btn btn-ghost btn-sm" href="index.html">Lihat situs</a>
        <button class="btn btn-ghost btn-sm btn-danger" id="btnKeluar" type="button" data-logout hidden>Keluar</button>
      </div>
    </header>

    <!-- ============ MENU SAMPING ============ -->
    <aside class="admin-side" id="adminSide" aria-label="Menu dashboard">
      <nav class="side-nav" id="sideNav">
        <button type="button" data-tab="ringkasan" class="active">📊 <span>Ringkasan</span></button>
        <button type="button" data-tab="resep">🍲 <span>Resep</span><em id="cntResep">0</em></button>
        <button type="button" data-tab="kategori">🗂 <span>Kategori</span><em id="cntKat">0</em></button>
        <button type="button" data-tab="tips">💡 <span>Tips Masak</span><em id="cntTips">0</em></button>
        <button type="button" data-tab="konten">✏️ <span>Konten Halaman</span></button>
        <button type="button" data-tab="pengguna">👥 <span>Pengguna</span><em id="cntUser">0</em></button>
        <button type="button" data-tab="data">💾 <span>Cadangan Data</span></button>
      </nav>
      <div class="side-note">
        <strong>Penyimpanan</strong>
        <p>Semua konten disimpan di database lokal browser (<code>localStorage</code>) lewat <code>js/db.js</code>.</p>
        <p class="side-updated" id="sideUpdated">—</p>
      </div>
    </aside>
    <div class="side-backdrop" id="sideBackdrop" hidden></div>

    <!-- ============ ISI ============ -->
    <main class="admin-main" id="adminMain"><!-- diisi oleh js/admin.js --></main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
